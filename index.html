// ── WEEK VIEW — 8am-8pm grid, long-press drag-to-reschedule ────────
// Shows the logged-in user's own pending tasks (same scope as Matrix),
// Monday-start week, all 7 days included (Sunday tasks still need a home
// even though the digest reminder itself skips Sunday).
function mondayOf(d) {
  const day = d.getDay(); // 0=Sun..6=Sat
  const diff = day===0 ? -6 : 1-day;
  const m = new Date(d);
  m.setDate(m.getDate()+diff);
  m.setHours(0,0,0,0);
  return m;
}
function fmtHourLabel(h) {
  const ap = h<12?"AM":"PM";
  const h12 = h%12===0?12:h%12;
  return h12+" "+ap;
}
function fmtWeekLabel(start,end) {
  const opts={month:"short",day:"numeric"};
  return start.toLocaleDateString("en-US",opts)+" – "+end.toLocaleDateString("en-US",opts);
}

window.toggleWeekView = function() {
  S.weekMode = !S.weekMode;
  if (S.weekMode) { S.matrixMode = false; if (!S.weekStart) S.weekStart = mondayOf(new Date()); }
  render();
};

window.shiftWeek = function(dir) {
  const d = new Date(S.weekStart);
  d.setDate(d.getDate()+dir*7);
  S.weekStart = d;
  renderWeekView();
};

function renderWeekView() {
  const el = document.getElementById("task-list"); if (!el) return;
  const u = S.user; if (!u) return;
  if (!S.weekStart) S.weekStart = mondayOf(new Date());

  const days = [];
  for (let i=0;i<7;i++) { const d=new Date(S.weekStart); d.setDate(d.getDate()+i); days.push(d); }
  const dayNames = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const hours = []; for (let h=8; h<=20; h++) hours.push(h);
  const todayStr = localDateStr(new Date());

  const mine = S.tasks.filter(t => !t.isPrivate && t.status!=="completed" && isAssigned(t,u));

  const tasksFor = (dateStr, hour) => mine.filter(t=>{
    if (t.dueDate !== dateStr) return false;
    const h = t.dueTime ? parseInt(t.dueTime.split(":")[0],10) : 17;
    return hour===null ? (h<8||h>20) : h===hour;
  });

  const pc = t => ({high:"#FF6B6B",medium:"#FFB347",low:"#00C896"}[t.priority]||"#aaa");
  const weekTaskChip = t => `<div class="week-task" data-task-id="${t.id}" style="border-left:3px solid ${pc(t)}">${esc(t.title)}</div>`;

  const dayColHtml = days.map((d,i)=>{
    const dateStr = localDateStr(d);
    const isToday = dateStr===todayStr;
    const otherTasks = tasksFor(dateStr,null);
    const hourRows = hours.map(h=>{
      const items = tasksFor(dateStr,h);
      return `<div class="week-slot" data-date="${dateStr}" data-hour="${h}">${items.map(weekTaskChip).join("")}</div>`;
    }).join("");
    return `<div class="week-day-col">
      <div class="week-day-header ${isToday?"today":""}">${dayNames[i]} ${d.getDate()}</div>
      <div class="week-other-bucket">${otherTasks.map(weekTaskChip).join("")}</div>
      ${hourRows}
    </div>`;
  }).join("");

  const hourLabelsHtml = hours.map(h=>`<div class="week-hour-label">${fmtHourLabel(h)}</div>`).join("");

  el.innerHTML = `
    <div class="week-nav-row">
      <button class="btn-secondary" onclick="window.shiftWeek(-1)">‹ Prev</button>
      <div class="week-label">${fmtWeekLabel(days[0],days[6])}</div>
      <button class="btn-secondary" onclick="window.shiftWeek(1)">Next ›</button>
    </div>
    <div class="week-note">📅 Your tasks — press and hold a task, then drag it to a new day/time</div>
    <div class="week-scroll-wrap">
      <div class="week-grid">
        <div class="week-hour-col">
          <div class="week-corner"></div>
          <div class="week-other-label">Other</div>
          ${hourLabelsHtml}
        </div>
        ${dayColHtml}
      </div>
    </div>`;
  const aw = document.getElementById("achieve-wrap"); if (aw) aw.style.display = "none";
  attachWeekDragHandlers();
}

function attachWeekDragHandlers() {
  document.querySelectorAll(".week-task").forEach(el=>{
    el.addEventListener("pointerdown", onWeekTaskPointerDown);
  });
}

function onWeekTaskPointerDown(e) {
  const taskId = e.currentTarget.dataset.taskId;
  const srcEl = e.currentTarget;
  const startX = e.clientX, startY = e.clientY;
  let dragging = false, ghost = null;

  const longPressTimer = setTimeout(()=>{
    dragging = true;
    srcEl.classList.add("week-task-lifted");
    ghost = srcEl.cloneNode(true);
    ghost.classList.add("week-task-ghost");
    ghost.style.left = startX+"px";
    ghost.style.top  = startY+"px";
    document.body.appendChild(ghost);
    createWeekEdgeZones();
  }, 350);

  function onMove(ev) {
    if (!dragging) {
      const dx=Math.abs(ev.clientX-startX), dy=Math.abs(ev.clientY-startY);
      if (dx>10||dy>10) { clearTimeout(longPressTimer); cleanup(); }
      return;
    }
    if (ghost) { ghost.style.left=ev.clientX+"px"; ghost.style.top=ev.clientY+"px"; }
    document.querySelectorAll(".week-slot.drag-over, .week-edge-zone.drag-over").forEach(s=>s.classList.remove("drag-over"));
    const under = document.elementFromPoint(ev.clientX, ev.clientY);
    const edgeZone = under ? under.closest(".week-edge-zone") : null;
    const slot = under ? under.closest(".week-slot") : null;
    if (edgeZone) edgeZone.classList.add("drag-over");
    else if (slot) slot.classList.add("drag-over");
  }

  function onUp(ev) {
    clearTimeout(longPressTimer);
    if (dragging) {
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      const edgeZone = under ? under.closest(".week-edge-zone") : null;
      const slot = under ? under.closest(".week-slot") : null;
      if (edgeZone) {
        window.rescheduleTaskByWeeks(taskId, edgeZone.id==="week-edge-next" ? 1 : -1);
      } else if (slot) {
        window.rescheduleTask(taskId, slot.dataset.date, slot.dataset.hour);
      }
    }
    cleanup();
  }

  function cleanup() {
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    document.querySelectorAll(".week-slot.drag-over").forEach(s=>s.classList.remove("drag-over"));
    srcEl.classList.remove("week-task-lifted");
    if (ghost) ghost.remove();
    removeWeekEdgeZones();
  }

  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onUp);
}

function createWeekEdgeZones() {
  if (document.getElementById("week-edge-prev")) return;
  const left = document.createElement("div");
  left.id = "week-edge-prev"; left.className = "week-edge-zone week-edge-left";
  left.innerHTML = "◀<br>Prev Week<br><span>same day &amp; time</span>";
  const right = document.createElement("div");
  right.id = "week-edge-next"; right.className = "week-edge-zone week-edge-right";
  right.innerHTML = "▶<br>Next Week<br><span>same day &amp; time</span>";
  document.body.appendChild(left);
  document.body.appendChild(right);
}
function removeWeekEdgeZones() {
  document.getElementById("week-edge-prev")?.remove();
  document.getElementById("week-edge-next")?.remove();
}

window.rescheduleTaskByWeeks = async function(taskId, weekDelta) {
  const t = S.tasks.find(x=>x.id===taskId); if (!t || !t.dueDate) return;
  const d = new Date(t.dueDate+"T00:00:00");
  d.setDate(d.getDate() + weekDelta*7);
  const newDate = localDateStr(d);
  if (S.fbReady && db) {
    await updateDoc(doc(db,"karya_tasks",taskId), {dueDate:newDate});
  } else {
    t.dueDate = newDate; saveLocal();
  }
  t.dueDate = newDate; // instant local feedback
  await addLog("reschedule", `"${t.title}" moved to ${newDate} (same time, ${weekDelta>0?"next":"previous"} week)`);
  renderWeekView();
  showToast(weekDelta>0 ? "📅 Moved to next week" : "📅 Moved to previous week");
};

window.rescheduleTask = async function(taskId, newDate, newHour) {
  const t = S.tasks.find(x=>x.id===taskId); if (!t) return;
  const newTime = String(newHour).padStart(2,"0")+":00";
  if (t.dueDate===newDate && t.dueTime===newTime) return; // dropped back in the same slot
  if (S.fbReady && db) {
    await updateDoc(doc(db,"karya_tasks",taskId), {dueDate:newDate, dueTime:newTime});
  } else {
    t.dueDate=newDate; t.dueTime=newTime; saveLocal();
  }
  t.dueDate=newDate; t.dueTime=newTime; // instant local feedback
  await addLog("reschedule", `"${t.title}" moved to ${newDate} ${newTime}`);
  renderWeekView();
  showToast("📅 Rescheduled");
};

function buildCard(t) {
  const now=new Date();
  const due=t.dueDate?new Date(t.dueDate+"T"+(t.dueTime||"23:59")):null;
  const overdue=due&&due<now&&t.status!=="completed"&&!t.isFuture;
  const soon=due&&!overdue&&(due-now)<86400000&&t.status!=="completed";
  const pc={high:"#FF6B6B",medium:"#FFB347",low:"#00C896"}[t.priority]||"#aaa";
  const names=Array.isArray(t.assignedTo)?t.assignedTo:[t.assignedTo||"Everyone"];
  const team=getTeam();
  const pills=names.map(n=>{
    if(n==="Everyone") return `<span class="assignee-pill" style="background:#1B2B4B"><span class="ap-dot"></span>Everyone</span>`;
    const m=team.find(x=>x.name===n);
    return `<span class="assignee-pill" style="background:${m?m.color:"#888"}"><span class="ap-dot"></span>${esc(n.split(" ")[0])}</span>`;
  }).join("");
  const snoozeCnt = t.snoozeCount||0;
  const showDragHandle = (S.view==="mine" && !(S.search||"").trim());
  return `<div class="task-card ${overdue?"overdue":""} ${t.status==="completed"?"done-card":""}" data-task-id="${t.id}">
    ${showDragHandle?`<button class="drag-handle" data-task-id="${t.id}">⠿</button>`:""}
    <button class="chk ${t.status==="completed"?"done":""}" onclick="window.toggleTask('${t.id}')">
      ${t.status==="completed"?"✓":""}
    </button>
    <div class="task-body" onclick="window.showDetail('${t.id}')">
      <div class="task-title ${t.status==="completed"?"strike":""}">${esc(t.title)}</div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:4px;flex-wrap:wrap">
        <div class="assignees-row" style="margin-bottom:0;flex:1;min-width:0">${pills}</div>
        <div style="display:flex;gap:4px;flex-shrink:0;align-items:center;flex-wrap:wrap">
          ${t.snoozed&&t.status!=="completed"?`<span class="future-tag snooze-badge" onclick="event.stopPropagation();window.showSnoozeLog('${t.id}')">⏸ Snoozed${snoozeCnt>1?" "+snoozeCnt+"×":""}</span>`:""}
          ${t.isFuture?'<span class="future-tag">🔄 Future</span>':""}
          ${t.isPrivate?'<span class="future-tag" style="background:#FDF2F8;color:#BE185D;border:1px solid #F9A8D4">🔒 Private</span>':""}
          ${t.recur?.type?'<span class="future-tag" style="background:#DCFCE7;color:#15803D;border:1px solid #86EFAC">🔁 '+recurLabel(t.recur)+'</span>':""}
        </div>
      </div>
      ${buildSubtaskBlock(t)}
      <div class="task-meta">
        <span class="prio-dot" style="background:${pc}"></span>
        ${due?`<span class="due-lbl ${overdue?"overdue":soon?"soon":""}">${overdue?"⚠ Overdue":fmtDue(due)}</span>`:""}
      </div>
    </div>
    <button class="menu-btn" onclick="window.showMenu('${t.id}')">⋮</button>
  </div>`;
}

function buildSubtaskBlock(t) {
  if (!Array.isArray(t.subtasks) || !t.subtasks.length) return "";
  const doneCount = t.subtasks.filter(s=>s.done).length;
  const total = t.subtasks.length;
  const pct = Math.round((doneCount/total)*100);
  const rows = t.subtasks.map(s => `
    <div class="subtask-item" onclick="event.stopPropagation();window.toggleSubtask('${t.id}','${s.id}')">
      <span class="subtask-tick ${s.done?"done":""}">${s.done?"✓":""}</span>
      <span class="subtask-title ${s.done?"strike":""}">${esc(s.title)}</span>
      ${s.assignee?`<span class="subtask-assignee">${esc(s.assignee.split(" ")[0])}</span>`:""}
    </div>`).join("");
  return `<div class="subtask-block" onclick="event.stopPropagation()">
      <div class="subtask-progress-bar"><div class="subtask-progress-fill" style="width:${pct}%"></div></div>
      <div class="subtask-progress-label">${doneCount}/${total} steps done</div>
      <div class="subtask-list">${rows}</div>
    </div>`;
}

// ── MY PENDING: DRAG-TO-REORDER (visual sort only) ──────────────────
// Never touches dueDate/dueTime — purely changes each task's sortOrder
// field, which only affects display order in the My Pending tab.
function attachReorderDragHandlers() {
  document.querySelectorAll(".drag-handle").forEach(el=>{
    el.addEventListener("pointerdown", onReorderPointerDown);
  });
}

function onReorderPointerDown(e) {
  e.stopPropagation();
  const taskId = e.currentTarget.dataset.taskId;
  const card = e.currentTarget.closest(".task-card");
  if (!card) return;
  const startX = e.clientX, startY = e.clientY;
  let dragging = false, ghost = null;

  const longPressTimer = setTimeout(()=>{
    dragging = true;
    card.classList.add("reorder-lifted");
    const rect = card.getBoundingClientRect();
    ghost = card.cloneNode(true);
    ghost.classList.add("reorder-ghost");
    ghost.style.width = rect.width+"px";
    ghost.style.left  = rect.left+"px";
    ghost.style.top   = rect.top+"px";
    document.body.appendChild(ghost);
  }, 300);

  function clearOverClasses() {
    document.querySelectorAll(".task-card.reorder-over-top,.task-card.reorder-over-bottom").forEach(c=>c.classList.remove("reorder-over-top","reorder-over-bottom"));
  }

  function onMove(ev) {
    if (!dragging) {
      const dx=Math.abs(ev.clientX-startX), dy=Math.abs(ev.clientY-startY);
      if (dx>10||dy>10) { clearTimeout(longPressTimer); cleanup(); }
      return;
    }
    if (ghost) {
      const rect = card.getBoundingClientRect();
      ghost.style.top = (ev.clientY - (startY-rect.top)) + "px";
    }
    clearOverClasses();
    const under = document.elementFromPoint(ev.clientX, ev.clientY);
    const targetCard = under ? under.closest(".task-card") : null;
    if (targetCard && targetCard !== card) {
      const trect = targetCard.getBoundingClientRect();
      const isTopHalf = ev.clientY < trect.top + trect.height/2;
      targetCard.classList.add(isTopHalf ? "reorder-over-top" : "reorder-over-bottom");
    }
  }

  function onUp(ev) {
    clearTimeout(longPressTimer);
    if (dragging) {
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      const targetCard = under ? under.closest(".task-card") : null;
      if (targetCard && targetCard !== card) {
        const trect = targetCard.getBoundingClientRect();
        const isTopHalf = ev.clientY < trect.top + trect.height/2;
        window.reorderMyPending(taskId, targetCard.dataset.taskId, isTopHalf?"before":"after");
      }
    }
    cleanup();
  }

  function cleanup() {
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    clearOverClasses();
    card.classList.remove("reorder-lifted");
    if (ghost) ghost.remove();
  }

  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onUp);
}

window.reorderMyPending = async function(draggedId, targetId, position) {
  if (draggedId === targetId) return;
  const u = S.user; if (!u) return;
  let mine = S.tasks.filter(t=>!t.isPrivate && t.status!=="completed" && isAssigned(t,u));
  mine = sortMyPending(mine); // same order the list is currently displayed in

  const ids = mine.map(t=>t.id);
  const fromIdx = ids.indexOf(draggedId);
  if (fromIdx===-1) return;
  ids.splice(fromIdx,1);
  let toIdx = ids.indexOf(targetId);
  if (toIdx===-1) return;
  if (position==="after") toIdx += 1;
  ids.splice(toIdx,0,draggedId);

  const writes = [];
  ids.forEach((id,i)=>{
    const t = S.tasks.find(x=>x.id===id); if (!t) return;
    const newOrder = (i+1)*10;
    if (t.sortOrder !== newOrder) {
      t.sortOrder = newOrder; // instant local feedback
      if (S.fbReady && db) writes.push(updateDoc(doc(db,"karya_tasks",id), {sortOrder:newOrder}));
    }
  });
  if (!S.fbReady || !db) saveLocal();
  renderTaskArea();
  try { await Promise.all(writes); } catch(e) { console.warn("[Karya] Reorder save error:", e); }
};

function updateStats() {
  const u=S.user; if(!u) return;
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  const pubTasks = S.tasks.filter(t=>!t.isPrivate);
  const privTasks = S.tasks.filter(t=>t.isPrivate && t.createdBy===u.name);
  set("sn-mine",  pubTasks.filter(t=>t.status!=="completed"&&isAssigned(t,u)).length);
  set("sn-team",  pubTasks.filter(t=>t.status!=="completed").length);
  set("sn-mydone",pubTasks.filter(t=>t.status==="completed"&&isAssigned(t,u)).length);
  set("sn-tdone", pubTasks.filter(t=>t.status==="completed").length);
  set("sn-priv",  privTasks.filter(t=>t.status!=="completed").length);
  // Count forgotten overdue tasks (overdue + no future reminder set) for nudge
  const now = new Date();
  const forgotten = pubTasks.filter(t => {
    if (t.status === "completed" || t.isFuture || !t.dueDate) return false;
    if (!isAssigned(t, u)) return false;
    const due = new Date(t.dueDate + "T" + (t.dueTime||"23:59"));
    if (due >= now) return false; // not overdue yet
    // No future reminder: either no reminder field, or reminder already fired
    return true;
  });
  const forgottenEl = document.getElementById("sn-forgotten");
  if (forgottenEl) {
    forgottenEl.textContent = forgotten.length;
    forgottenEl.closest(".stat-btn").style.display = forgotten.length > 0 ? "" : "none";
  }
  renderAchievements();
}

function renderAchievements() {
  const inner=document.getElementById("achieve-inner");
  const progRow=document.getElementById("team-prog-row");
  if (!inner) return;
  const team=getTeam();
  const stats=team.map(m=>{
    const assigned=taggedTasksFor(m.name);
    const done=assigned.filter(t=>t.status==="completed");
    const pct=assigned.length?Math.round(done.length/assigned.length*100):0;
    return {name:m.name.split(" ")[0],color:m.color,pct,done:done.length,total:assigned.length,winner:pct>=90&&assigned.length>0};
  }).sort((a,b)=>b.pct-a.pct);
  inner.innerHTML=`<span class="achieve-hd">⚡ Efficiency</span>`
    +stats.map(s=>`<span class="achieve-entry">${s.winner?"🏆 ":""}<span class="ach-dot" style="background:${s.color}"></span>${esc(s.name)} <span class="ach-pct">${s.pct}%</span><span class="ach-cnt">(${s.done}/${s.total})</span></span>`).join(`<span class="ach-sep">|</span>`);
  // Team progress
  const totalDone=S.tasks.filter(t=>t.status==="completed").length;
  const miles=[50,100,200,500];
  const next=miles.find(m=>m>totalDone)||miles[miles.length-1];
  const prev=miles[miles.indexOf(next)-1]||0;
  const pct=Math.min(100,Math.round(((totalDone-prev)/(next-prev))*100));
  const lv=miles.indexOf(next)+1;
  const atMile=miles.includes(totalDone);
  if (progRow) progRow.innerHTML=`
    <span class="team-prog-lbl">Team Goal</span>
    <div class="team-prog-bar-bg"><div class="team-prog-bar-fill" style="width:${pct}%"></div></div>
    <span class="team-prog-val">${totalDone}/${next}</span>
    <span class="team-milestone" style="color:${atMile?"#FFD700":"rgba(255,255,255,.35)"}">${atMile?"🎉 Level "+lv+" Unlocked!":"Lv"+lv}</span>`;
}

// ── QUICK ADD: conversational text → task ─────────────────────────
function qaEscapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function qaYmd(d) { return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function parseQuickAddText(raw) {
  let text = " " + raw.trim() + " ";
  const warnings = [];
  const now = new Date();

  // Strip common lead-in filler so it doesn't pollute the title
  text = text.replace(/\b(remind\s+(me|us|everyone)\s+to|please|pls)\b/gi, " ");

  // ---- 1. Detect a team member's name ----
  const team = getTeam() || [];
  let assignee = null;
  const candidates = [];
  team.forEach(m => {
    candidates.push(m.name);
    m.name.split(" ").forEach(tok => { if (tok.length >= 3) candidates.push(tok); });
  });
  candidates.sort((a,b)=>b.length-a.length);
  const lowerText = text.toLowerCase();
  for (const cand of candidates) {
    if (lowerText.indexOf(cand.toLowerCase()) !== -1) {
      const full = team.find(m => m.name === cand || m.name.split(" ").includes(cand));
      assignee = full ? full.name : cand;
      const re = new RegExp("\\b(remind|tell|ask)?\\s*" + qaEscapeRegex(cand) + "\\b\\s*(\\bto\\b)?", "i");
      text = text.replace(re, " ");
      break;
    }
  }

  // ---- 1b. Future-task wording ----
  // "future task" / "someday" means there is deliberately no firm date yet,
  // so a missing date is expected, not an error worth warning about.
  let isFuture = false;
  const futRe = /\b(mark(ed)?\s+as\s+)?(a\s+)?future\s+task\b|\bfuture\s+task\b|\bsomeday\b|\bno\s+due\s+date\b|\bbacklog\b/i;
  if (futRe.test(text)) { isFuture = true; text = text.replace(futRe, " "); }

  // ---- 2. Detect date ----
  const weekdays = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
  const monthNames = ["january","february","march","april","may","june","july","august","september","october","november","december"];
  let dueDate = null, m;

  if (/\bday after tomorrow\b/i.test(text)) {
    const d=new Date(now); d.setDate(d.getDate()+2); text=text.replace(/\bday after tomorrow\b/i," "); dueDate=qaYmd(d);
  } else if (/\btoday\b/i.test(text)) {
    text=text.replace(/\btoday\b/i," "); dueDate=qaYmd(now);
  } else if (/\btomorrow\b/i.test(text)) {
    const d=new Date(now); d.setDate(d.getDate()+1); text=text.replace(/\btomorrow\b/i," "); dueDate=qaYmd(d);
  } else if ((m = text.match(/\bin\s+(\d+)\s*days?\b/i))) {
    const d=new Date(now); d.setDate(d.getDate()+parseInt(m[1])); text=text.replace(m[0]," "); dueDate=qaYmd(d);
  } else if ((m = text.match(/\b(next\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/i))) {
    const wantDow = weekdays.indexOf(m[2].toLowerCase());
    const d = new Date(now);
    let diff = wantDow - d.getDay();
    if (diff <= 0) diff += 7;
    d.setDate(d.getDate()+diff);
    text = text.replace(m[0]," ");
    dueDate = qaYmd(d);
  } else if ((m = text.match(/\b(\d{1,2})(st|nd|rd|th)?\s+(january|february|march|april|may|june|july|august|september|october|november|december)\b/i))) {
    const day=parseInt(m[1]); const month=monthNames.indexOf(m[3].toLowerCase());
    let d=new Date(now.getFullYear(),month,day);
    if (d < new Date(now.getFullYear(),now.getMonth(),now.getDate())) d=new Date(now.getFullYear()+1,month,day);
    text = text.replace(m[0]," ");
    dueDate = qaYmd(d);
  } else if ((m = text.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/))) {
    const day=parseInt(m[1]), month=parseInt(m[2])-1;
    const year = m[3] ? (m[3].length===2?2000+parseInt(m[3]):parseInt(m[3])) : now.getFullYear();
    text = text.replace(m[0]," ");
    dueDate = qaYmd(new Date(year,month,day));
  }

  if (!dueDate) {
    dueDate = qaYmd(now);
    if (!isFuture) warnings.push("No date detected — defaulted to today.");
  }

  // ---- 3. Detect time ----
  let dueTime = null;
  if (/\bat\s+noon\b/i.test(text)) { text=text.replace(/\bat\s+noon\b/i," "); dueTime="12:00"; }
  else if (/\bnoon\b/i.test(text)) { text=text.replace(/\bnoon\b/i," "); dueTime="12:00"; }
  else if (/\bat\s+midnight\b/i.test(text)) { text=text.replace(/\bat\s+midnight\b/i," "); dueTime="00:00"; }
  else if (/\bmidnight\b/i.test(text)) { text=text.replace(/\bmidnight\b/i," "); dueTime="00:00"; }
  else if ((m = text.match(/\bat\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/i)) || (m = text.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i))) {
    let h=parseInt(m[1]); const min=m[2]?parseInt(m[2]):0; const ap=(m[3]||"").toLowerCase();
    if (ap==="pm" && h!==12) h+=12;
    if (ap==="am" && h===12) h=0;
    if (!ap && h>=1 && h<=7) h+=12; // bare small hour with no am/pm, e.g. "at 6" — assume evening
    text = text.replace(m[0]," ");
    dueTime = String(h).padStart(2,"0")+":"+String(min).padStart(2,"0");
  } else if ((m = text.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/))) {
    text=text.replace(m[0]," ");
    dueTime = m[1].padStart(2,"0")+":"+m[2];
  }

  // Strip vague time-of-day words — we don't infer a specific time from these,
  // so leaving them in would just clutter the title
  text = text.replace(/\b(this\s+)?(morning|afternoon|evening|night)\b/gi," ");

  if (!dueTime) {
    dueTime = "17:00";
    if (!isFuture) warnings.push("No time detected — defaulted to 5:00 PM.");
  }

  // ---- 4. Clean up leftover title text ----
  let title = text.replace(/\s{2,}/g," ").trim();
  title = title.replace(/^[\-:,\s]+|[\-:,\s]+$/g,"");
  // Strip dangling leading/trailing filler prepositions left over after
  // removing date/time/name phrases (e.g. "Meeting with on" -> "Meeting")
  let prevTitle;
  do {
    prevTitle = title;
    title = title.replace(/^(on|at|in|for|with|to|by|and)\s+/i,"").trim();
    title = title.replace(/\s+(on|at|in|for|with|to|by|and)$/i,"").trim();
  } while (title !== prevTitle && title.length > 0);
  if (!title) {
    title = "";
    warnings.push("Couldn't find a task description — please add one below.");
  } else {
    title = title.charAt(0).toUpperCase() + title.slice(1);
  }

  return { title, dueDate, dueTime, isFuture, assignee: assignee || (S.user ? S.user.name : "Everyone"), warnings };
}

      <button type="button" class="mic-btn" id="qa-mic-btn"

  if (ta) ta.focus();

// ── VOICE-TO-TASK ──────────────────────────────────────────────────
let _recognition = null;
let _recognizing = false;
let _voiceFinalTranscript = "";

function getSpeechRecognitionCtor() {
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

window.startVoiceCapture = function(btn) {
  if (_recognizing) return;
  const SR = getSpeechRecognitionCtor();
  if (!SR) {
    const isBrave = (navigator.brave && typeof navigator.brave.isBrave === "function");
    showToast(isBrave ? "🎤 Voice input needs Brave Shields adjusted for this site" : "🎤 Voice input isn't supported in this browser");
    return;
  }
  const ta = document.getElementById("qa-input");
  _voiceFinalTranscript = "";
  _recognition = new SR();
  _recognition.lang = "en-IN";
  _recognition.interimResults = true;
  _recognition.continuous = true;
  _recognition.maxAlternatives = 1;

  btn.classList.add("recording");
  btn.textContent = "🔴 Listening… release when done";

  // Bug fix: the old version re-summed e.results from index 0 on every
  // event. Some Android speech engines re-emit growing overlapping
  // fragments as separate entries rather than replacing one in place,
  // which made that naive re-sum snowball into repeated text. Using
  // e.resultIndex processes only what's NEW since the last event, and
  // final segments are accumulated separately from the transient
  // in-progress (interim) segment so nothing gets counted twice.
  _recognition.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const chunk = e.results[i][0].transcript;
      if (e.results[i].isFinal) _voiceFinalTranscript += chunk + " ";
      else interim += chunk;
    }
    if (ta) ta.value = (_voiceFinalTranscript + interim).trim();
  };
  _recognition.onerror = (e) => {
    console.warn("[Karya] Speech recognition error:", e.error);
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      showToast("🎤 Microphone permission denied — check browser settings");
    } else if (e.error === "no-speech") {
      showToast("🎤 Didn't catch that — try again");
    }
  };
  _recognition.onend = () => {
    _recognizing = false;
    const b = document.getElementById("qa-mic-btn");
    if (b) { b.classList.remove("recording"); b.textContent = "🎤 Hold to speak"; }
    const finalText = (document.getElementById("qa-input")?.value || "").trim();
    if (finalText) {
      window._qaRaw = finalText;
      const parsed = parseQuickAddText(finalText);
      window._qaParsed = parsed;
      showQuickAddPreview(parsed);
    }
  };

  try { _recognition.start(); _recognizing = true; }
  catch(err) { console.warn("[Karya] Could not start speech recognition:", err); }
};

  if (_recognition && _recognizing) _recognition.stop(); // triggers onend, which shows the preview
};

// ── TOGGLE COMPLETE ───────────────────────────────────────────────
window.toggleTask = async function(id) {
  const t=S.tasks.find(x=>x.id===id); if (!t) return;
  const ns=t.status==="completed"?"pending":"completed";
  // Check BEFORE the status flips, since this is what we're celebrating
  const dueAtToggle = t.dueDate ? new Date(t.dueDate+"T"+(t.dueTime||"23:59")) : null;
  const wasOverdue = dueAtToggle && dueAtToggle < new Date() && !t.isFuture && t.status!=="completed";

  // Snapshot subtasks BEFORE any mutation, so Undo can restore exactly what
  // was checked/unchecked rather than just flipping status back.
  const subtasksBefore = Array.isArray(t.subtasks) ? t.subtasks.map(s=>({...s})) : null;
  // Completing the parent directly (not via ticking off the last subtask)
  // marks every subtask done too, so the checklist stays consistent.
  const subtasksAfter = (ns==="completed" && subtasksBefore)
    ? subtasksBefore.map(s=>({...s, done:true}))
    : subtasksBefore;

  const updatePayload = { status: ns };
  if (subtasksAfter) updatePayload.subtasks = subtasksAfter;

  if (S.fbReady&&db) {
    await updateDoc(doc(db,"karya_tasks",id),updatePayload);
  } else {
    t.status=ns; if (subtasksAfter) t.subtasks=subtasksAfter; saveLocal(); renderTaskArea(); updateStats();
  }
  await addLog(ns==="completed"?"complete":"reopen",`"${t.title}"`);
  if (ns==="completed"){
    closeModal(); showConfetti();
    celebrateTaskComplete(id); // Option 4: card glow + score pulse

    // Auto-create next recurrence if task has a repeat config. We capture the
    // new doc's ID so that if the person hits Undo, we clean that up too —
    // not just reopen the just-completed task.
    const t2 = S.tasks.find(x=>x.id===id);
    let recurPromise = null;
    let createdNextId = null;
    if (t2?.recur?.type) {
      const fromDue = t2.dueDate ? new Date(t2.dueDate+"T"+(t2.dueTime||"23:59")) : new Date();
      const nextDue = nextRecurDate(t2.recur, fromDue);
      const nextDateStr = localDateStr(nextDue);
      const nextTask = {
        ...t2,
        id: undefined,
        status: "pending",
        dueDate: nextDateStr,
        snoozed: false, snoozeCount: 0, snoozeLog: [],
        notifiedAt: null, notifAcknowledged: false,
        createdAt: new Date().toISOString(),
        createdBy: S.user.name
      };
      delete nextTask.id;
      if (S.fbReady && db) {
        recurPromise = addDoc(collection(db,"karya_tasks"),{...nextTask,createdAt:serverTimestamp()})
          .then(ref => { createdNextId = ref.id; showToast("🔁 Next " + t2.recur.type + " task created"); return ref; });
      }
    }

    // Undo: reopens this task, restores subtasks to exactly how they were
    // before this completion, and if a recurring next-occurrence was just
    // created as a side effect, removes that too so nothing gets duplicated.
    const undoCompletion = async () => {
      try {
        const restorePayload = { status:"pending" };
        if (subtasksBefore) restorePayload.subtasks = subtasksBefore;
        if (S.fbReady && db) {
          await updateDoc(doc(db,"karya_tasks",id),restorePayload);
          if (recurPromise) {
            await recurPromise;
            if (createdNextId) await deleteDoc(doc(db,"karya_tasks",createdNextId));
          }
        } else {
          const idx=S.tasks.findIndex(x=>x.id===id);
          if (idx>-1) { S.tasks[idx].status="pending"; if(subtasksBefore) S.tasks[idx].subtasks=subtasksBefore; saveLocal(); }
        }
        await addLog("reopen", `"${t.title}" (undo)`);
        renderTaskArea(); updateStats();
        showToast("↩ Undone");
      } catch(e) {
        console.error("[Karya] Undo failed:", e);
        showToast("⚠️ Couldn't undo — reopen it manually from the task menu");
      }
    };

    showUndoToast(wasOverdue ? "🏁 You completed overdue task. 🎉" : "🎉 Task completed!", undoCompletion);
    setTimeout(checkWinnerCelebration, 1200);
  } else showToast("Task reopened");
};

  return Array.from(container.querySelectorAll(".subtask-row")).map(row => ({

    title: (row.querySelector(".subtask-title-input")?.value||"").trim(),

    done: row.dataset.done === "true"

}

window.toggleSubtask = async function(taskId, subId) {
  const t = S.tasks.find(x=>x.id===taskId); if (!t || !Array.isArray(t.subtasks)) return;
  const updated = t.subtasks.map(s => s.id===subId ? {...s, done: !s.done} : s);
  const allDone = updated.length>0 && updated.every(s=>s.done);
  const wasCompleted = t.status==="completed";

  if (S.fbReady && db) {
    await updateDoc(doc(db,"karya_tasks",taskId), {subtasks: updated});
  } else {
    t.subtasks = updated; saveLocal();
  }
  t.subtasks = updated; // instant local feedback; Firestore listener reconciles shortly after
  renderTaskArea(); updateStats();

  if (allDone && !wasCompleted) {
    // Auto-complete the parent — reuse the normal completion path so
    // confetti/toast/recurrence/scoring all behave exactly as they do
    // when someone ticks the main checkbox directly.
    await window.toggleTask(taskId);
  }
  // Note: unticking a step after the parent had already auto-completed does
  // NOT auto-reopen the parent — that's a manual action from the task menu,
  // to avoid surprising side effects like re-triggering recurrence creation.
};

    title, description:(document.getElementById("et-desc")?.value||"").trim(),
    assignedTo:getChips("assign-grid-edit"),
    priority:document.getElementById("et-prio")?.value||"medium",
    dueDate:document.getElementById("et-date")?.value||"",
    dueTime:(function(){ var h=document.getElementById("et-time-h"); var m=document.getElementById("et-time-m"); var a=document.getElementById("et-time-ap"); if(h&&m&&a){ return window.to24(h.value,m.value,a.value); } return document.getElementById("et-time-hidden")?.value||"17:00"; })(),
    isFuture:document.getElementById("et-future")?.checked||false,
    subtasks:getSubtasksFromForm("et"),
    image:window._clearImg?null:(t?.image||null)
  };
  window._clearImg=false;
  if (S.fbReady&&db) {
    try { await updateDoc(doc(db,"karya_tasks",id),upd); }
    catch(e) { console.error("Update failed:",e); const i=S.tasks.findIndex(x=>x.id===id); if(i>-1) S.tasks[i]={...S.tasks[i],...upd}; saveLocal(); renderTaskArea(); updateStats(); showToast("⚠️ Saved locally — check Firebase rules"); return; }
  } else { const i=S.tasks.findIndex(x=>x.id===id); if(i>-1) S.tasks[i]={...S.tasks[i],...upd}; saveLocal(); renderTaskArea(); updateStats(); }
  scheduleReminder({...t,...upd,id});
  await addLog("edit",`"${title}"`);
  closeModal(); showToast("Task updated ✓");
};

// ── REMINDER ENGINE ───────────────────────────────────────────────
const _scheduled = new Set(); // track task IDs already scheduled this session

// Latest date on which a reminder could still be needed for this task:
// max(dueDate, every personal snooze date). Using the MINIMUM here was a bug —
// for a long-overdue task that someone snoozed to tomorrow, the minimum is the
// ancient dueDate, which falls outside the query window and the reminder is
// silently never sent. The maximum correctly keeps such a task discoverable.
function remindUntilDate(userReminders, dueDate) {
  const dates = Object.values(userReminders || {})
    .filter(v => typeof v === "string" && v.indexOf("T") > 0)
    .map(v => v.split("T")[0]);
  if (dueDate) dates.push(dueDate);
  if (!dates.length) return null;
  return dates.sort()[dates.length - 1];
}

function myRemindAt(t, userName) {
  // A person's own snooze (userReminders[name], an IST wall-clock string)
  // overrides the task's shared reminder time. Falls back to the task's
  // dueDate/dueTime minus its reminder offset when no personal override.
  const ovr = t.userReminders && t.userReminders[userName];
  if (ovr && typeof ovr === "string" && ovr.indexOf("T") > 0) return new Date(ovr);
  if (!t.dueDate) return null;
  const due = new Date(t.dueDate+"T"+(t.dueTime||"23:59"));
  if (!t.reminder || t.reminder==="ontime") return due;
  if (t.reminder==="") return null;
  return new Date(due.getTime()-parseInt(t.reminder)*60000);
}

function rescheduleAllReminders() {
  // Called on every data load/reload — re-arms pending reminders
  // ONLY schedules tasks assigned to the currently logged-in user
  if (!S.user) return;
  S.tasks.forEach(t => {
    if (t.status==="completed" || !t.dueDate || _scheduled.has(t.id)) return;
    // Skip tasks not assigned to the logged-in user
    const assignees = Array.isArray(t.assignedTo) ? t.assignedTo : [t.assignedTo||"Everyone"];
    if (!assignees.includes("Everyone") && !assignees.includes(S.user.name)) return;
    const remindAt = myRemindAt(t, S.user.name);
    if (remindAt && remindAt > new Date()) {
      _doSchedule(t, remindAt);
      _scheduled.add(t.id);
    }
  });
}

function scheduleReminder(task) {
  if (!task.dueDate || task.status==="completed") return;
  if (task.isFuture) return;  // no firm date yet — nothing to remind about
  // Only schedule if current user is assigned
  if (S.user) {
    const assignees = Array.isArray(task.assignedTo) ? task.assignedTo : [task.assignedTo||"Everyone"];
    if (!assignees.includes("Everyone") && !assignees.includes(S.user.name)) return;
  }
  const remindAt = S.user ? myRemindAt(task, S.user.name) : null;
  if (!remindAt || remindAt <= new Date()) return;
  _scheduled.delete(task.id); // allow rescheduling
  _doSchedule(task, remindAt);
  _scheduled.add(task.id);
  // Request OS notification permission proactively
  if ("Notification" in window && Notification.permission==="default") Notification.requestPermission().catch(()=>{});
}

function _doSchedule(task, remindAt) {
  const delay = remindAt - new Date();
  if (delay <= 0) return;
  const MAX = 2000000000;
  setTimeout(async () => {
    // CRITICAL FIX: Only show reminder to users assigned to this task
    if (S.user) {
      const assignees = Array.isArray(task.assignedTo)
        ? task.assignedTo
        : [task.assignedTo || "Everyone"];
      const mine = assignees.includes("Everyone") || assignees.includes(S.user.name);
      if (!mine) {
        console.log("[Karya] Skipping — not assigned to " + S.user.name);
        return;
      }
    }

    // RE-CHECK LIVE STATUS: task may have been completed on another device
    // while the snooze timer was running. S.tasks is kept live by the
    // Firestore real-time listener so this reflects the true current state.
    const liveTask = S.tasks.find(x => x.id === task.id);
    if (!liveTask || liveTask.status === "completed") {
      console.log("[Karya] Skipping reminder — task completed on another device:", task.title);
      return;
    }

    // CROSS-DEVICE SYNC (per-user): Check if THIS user already acknowledged
    // this reminder on another device. Uses per-user path so other users
    // on shared tasks are completely unaffected.
    if (S.fbReady && db && S.user?.id) {
      try {
        const ackSnap = await getDoc(doc(db, "karya_notif_ack", S.user.id + "_" + task.id));
        if (ackSnap.exists()) {
          console.log("[Karya] Skipping — already acknowledged on another device:", task.title);
          return;
        }
      } catch(e) { /* non-fatal — show reminder if read fails */ }
    }

    const notifTitle = "Karya — Do Now";
    const notifBody  = task.title;
    const notifTag   = "karya-" + (task.id || "task");
    let shown = false;

    // Method 1: Service Worker (works when minimized)
    try {
      if (_swReg && "Notification" in window && Notification.permission === "granted") {
        await _swReg.showNotification(notifTitle, {
          body:               notifBody,
          tag:                notifTag,
          icon:               KARYA_ICON,
          badge:              "./karya-badge-96.png",
          requireInteraction: true,
          renotify:           true,
          vibrate:            [300,100,300,100,300],
          data:               { taskId: task.id||"", url: location.href }
        });
        shown = true;
        console.log("[Karya] SW notification sent for:", notifBody);
      }
    } catch(e) { console.warn("[Karya] SW notif failed:", e.message); }

    // Method 2: Window Notification fallback
    if (!shown && "Notification" in window && Notification.permission === "granted") {
      try {
        new Notification(notifTitle, {
          body: notifBody, tag: notifTag, requireInteraction: true
        });
        shown = true;
      } catch(e) {}
    }

    // Method 3: Always show in-app popup (when app is open)
    showBigNotif(notifBody, task.id || "");
    markReminderSeen(task.id);

  }, Math.min(delay, MAX));
}

// Track which reminders have already shown their popup this session (avoids double-popup)
const _seenReminders = new Set();
function markReminderSeen(taskId) { if (taskId) _seenReminders.add(taskId); }
function wasReminderSeen(taskId) { return _seenReminders.has(taskId); }


// ── BIG NOTIFICATION (persistent, 40% screen) ────────────────────
function playChime() {
  try {
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    function bell(t,freq,dur){
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type="sine"; o.frequency.setValueAtTime(freq,t);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.4,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.start(t); o.stop(t+dur);
      const o2=ctx.createOscillator(), g2=ctx.createGain();
      o2.connect(g2); g2.connect(ctx.destination);
      o2.type="sine"; o2.frequency.setValueAtTime(freq*2.76,t);
      g2.gain.setValueAtTime(0,t); g2.gain.linearRampToValueAtTime(.16,t+.01); g2.gain.exponentialRampToValueAtTime(.001,t+dur*.65);
      o2.start(t); o2.stop(t+dur);
    }
    const now=ctx.currentTime;
    bell(now+.05,880,2.2); bell(now+2.1,880,2.2); bell(now+4.15,880,2.2);
  } catch(e){ console.warn("Chime:",e); }
}


// ── CROSS-DEVICE NOTIFICATION ACK — per-user, per-task ───────────
// Schema: karya_notif_ack/{userId}_{taskId}
// { userId, taskId, ts, expiresAt (24hrs) }
// Per-user so acknowledging on one device never kills another user's popup.

function notifAckId(userId, taskId) {
  return userId + "_" + taskId;
}

async function writeNotifAck(taskId) {
  if (!S.user?.id || !taskId || !S.fbReady || !db) return;
  try {
    const expiry = new Date(Date.now() + 24 * 60 * 60 * 1000); // 24 hours
    await setDoc(
      doc(db, "karya_notif_ack", notifAckId(S.user.id, taskId)),
      { userId: S.user.id, taskId, ts: serverTimestamp(), expiresAt: expiry.toISOString() }
    );
  } catch(e) { console.warn("[Karya] writeNotifAck failed:", e); }
}

async function cleanupOldNotifAcks() {
  // Runs once per session. Deletes this user's ack entries older than 7 days.
  if (!S.fbReady || !db || !S.user?.id) return;
  const cutoff = Date.now() - ACK_TTL_MS;
  try {
    const q = query(
      collection(db, "karya_notif_ack"),
      where("userId", "==", S.user.id),
      where("ackedAt", "<", cutoff)
    );
    const snap = await getDocs(q);
    const deletes = snap.docs.map(d => deleteDoc(doc(db, "karya_notif_ack", d.id)));
    await Promise.all(deletes);
    if (deletes.length) console.log("[Karya] Cleaned", deletes.length, "old ack entries");
  } catch(e) { console.warn("[Karya] cleanupOldNotifAcks failed:", e); }
}

async function checkNotifAck(taskId) {
  if (!S.user?.id || !taskId || !S.fbReady || !db) return false;
  try {
    const snap = await getDoc(doc(db, "karya_notif_ack", notifAckId(S.user.id, taskId)));
    if (!snap.exists()) return false;
    const data = snap.data();
    // Check not expired
    if (data.expiresAt && new Date(data.expiresAt) < new Date()) return false;
    return true;
  } catch(e) { return false; }
}

async function cleanExpiredNotifAcks() {
  if (!S.user?.id || !S.fbReady || !db) return;
  try {
    // Query all ack entries for this user
    const q = query(
      collection(db, "karya_notif_ack"),
      where("userId", "==", S.user.id)
    );
    const snap = await getDocs(q);
    const now = new Date();
    const deletes = [];
    snap.forEach(d => {
      const data = d.data();
      if (data.expiresAt && new Date(data.expiresAt) < now) {
        deletes.push(deleteDoc(doc(db, "karya_notif_ack", d.id)));
      }
    });
    if (deletes.length) {
      await Promise.all(deletes);
      console.log("[Karya] Cleaned", deletes.length, "expired notif ack entries");
    }
  } catch(e) { console.warn("[Karya] cleanExpiredNotifAcks failed:", e); }
}


// ── CROSS-DEVICE REMINDER ACK — per user, per task ───────────────
const ACK_TTL_MS = 7 * 24 * 60 * 60 * 1000; // 7 days in ms — ack entries older than this are cleaned up

function showBigNotif(taskTitle, taskId) {
  document.querySelectorAll(".big-notif-overlay").forEach(e=>{
    // Cancel any existing cross-device watcher before removing
    if (e._ackUnsubscribe) { try { e._ackUnsubscribe(); } catch(er) {} }
    e.remove();
  });
  playChime();
  const el = document.createElement("div");
  el.className = "big-notif-overlay";
  el.dataset.taskId = taskId || "";
  const tid = taskId || "";
  const rows = [
    "<div class='big-notif-box'>",
    "  <div class='bni-header'>",
    "    <span class='bni-bell'>🔔</span>",
    "    <div class='bni-title-wrap'>",
    "      <div class='bni-task'>" + esc(taskTitle) + "</div>",
    "      <div class='bni-donow'>Karya \u2014 Do Now</div>",
    "    </div>",
    "  </div>",
    "  <div class='bni-snooze-lbl'>Reschedule</div>",
    "  <div class='bni-snooze-row'>",
    "    <button class='snooze-btn' onclick='window.snoozeTask(\"" + tid + "\",30,this)'>+30 min</button>",
    "    <button class='snooze-btn' onclick='window.snoozeTask(\"" + tid + "\",60,this)'>+1 hr</button>",
    "    <button class='snooze-btn' onclick='window.snoozeTask(\"" + tid + "\",120,this)'>+2 hrs</button>",
    "    <button class='snooze-btn' onclick='window.snoozeTask(\"" + tid + "\",\"tomorrow\",this)'>Tomorrow</button>",
    "  </div>",
    "  <button class='big-notif-close' onclick='window.closeBigNotifById(\"" + tid + "\")'>",
    "    \u2713 Got it \u2014 on my way",
    "  </button>",
    "</div>"
  ];
  el.innerHTML = rows.join("\n");
  document.body.appendChild(el);

  // CROSS-DEVICE WATCHER: Watch THIS USER's per-user ack entry.
  // If another device of the same user acknowledges, close this popup.
  // Other users on shared tasks are completely unaffected — they watch
  // their own ack paths.
  if (tid && S.fbReady && db && S.user?.id) {
    const ackId = S.user.id + "_" + tid;
    try {
      const unsub = onSnapshot(doc(db, "karya_notif_ack", ackId), (snap) => {
        if (!snap.exists()) return;
        // Entry exists = this user acknowledged on another device
        const overlay = document.querySelector(".big-notif-overlay[data-task-id='" + tid + "']");
        if (overlay) {
          if (overlay._ackUnsubscribe) { try { overlay._ackUnsubscribe(); } catch(er) {} }
          overlay.remove();
          console.log("[Karya] Popup closed — " + S.user.name + " acknowledged on another device");
        }
      });
      // Store unsubscribe fn so we cancel it when popup is manually closed
      el._ackUnsubscribe = unsub;
    } catch(e) {
      console.warn("[Karya] Cross-device watcher setup failed:", e);
    }
  }
  // PERSISTENT — no auto dismiss
}

// Close big notif, write per-user ack to Firestore, cancel watcher
window.closeBigNotifById = function(tid) {
  const overlay = document.querySelector(
    tid ? ".big-notif-overlay[data-task-id='" + tid + "']" : ".big-notif-overlay"
  );
  if (!overlay) return;
  if (overlay._ackUnsubscribe) { try { overlay._ackUnsubscribe(); } catch(e) {} }
  overlay.remove();
  // Write per-user ack so this user's other devices close their popups too
  if (tid) writeNotifAck(tid);
};


window.snoozeTask = async function(id, mins, btn) {
  if (!id) { window.closeBigNotifById(""); return; }
  const t=S.tasks.find(x=>x.id===id);
  if (!t) { window.closeBigNotifById(id); return; }
  // Write per-user ack so this user's other devices close their popups
  writeNotifAck(id);
  // Snooze is measured from NOW, not from the original due date. Snoozing an
  // already-overdue task off its old due date landed the new reminder in the
  // past, which made it re-fire immediately.
  const base=new Date();
  let newDue;
  if (mins==="tomorrow") { newDue=new Date(base); newDue.setDate(newDue.getDate()+1); newDue.setHours(9,0,0,0); }
  else newDue=new Date(base.getTime()+mins*60000);
  const newDate=localDateStr(newDue);  // localDateStr, not toISOString (UTC shift bug)
  const newTime=newDue.toTimeString().slice(0,5);
  const label=mins==="tomorrow"?"Tomorrow 9am":`+${mins>=60?(mins/60)+"hr":mins+"min"}`;
  const snoozeLog=Array.isArray(t.snoozeLog)?[...t.snoozeLog]:[];
  snoozeLog.push({ user:S.user.name, mins, label, ts:new Date().toISOString() });
  // PER-USER: only shifts this person's own reminder. dueDate/dueTime is the
  // task's shared deadline and is deliberately left untouched, so one
  // assignee snoozing no longer moves everyone else's reminder.
  const userReminders=Object.assign({}, t.userReminders||{});
  userReminders[S.user.name]=newDate+"T"+newTime;
  const upd={ userReminders, remindUntil:remindUntilDate(userReminders,t.dueDate),
              snoozed:true, snoozeCount:snoozeLog.length, snoozeLog };
  if (S.fbReady&&db) { await updateDoc(doc(db,"karya_tasks",id),upd); }
  else { const i=S.tasks.findIndex(x=>x.id===id); if(i>-1) S.tasks[i]={...S.tasks[i],...upd}; saveLocal(); renderTaskArea(); updateStats(); }
  _scheduled.delete(id);
  scheduleReminder({...t,...upd,id});
  window.closeBigNotifById(id);
  showToast(`⏸ Snoozed to ${label}`);
  await addLog("snooze",`"${t.title}" → ${label} (snooze #${snoozeLog.length} by ${S.user.name})`);
};

// ── WINNER CELEBRATION (90% achievement) ─────────────────────────
function playWinnerChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function note(t, freq, dur, vol) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = "sine"; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol || 0.35, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.start(t); o.stop(t + dur);
    }
    const n = ctx.currentTime;
    // Ascending victory fanfare
    note(n+.0,  523, .18);  // C
    note(n+.15, 659, .18);  // E
    note(n+.30, 784, .18);  // G
    note(n+.45, 1047,.35);  // High C
    note(n+.80, 784, .15);
    note(n+.95, 1047,.15);
    note(n+1.1, 1319,.5, .45); // High E — held
  } catch(e) {}
}

let _winnerShownFor = {}; // prevent repeated celebrations

function isoWeekKey(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  const weekNo = Math.ceil((((date - yearStart) / 86400000) + 1)/7);
  return date.getUTCFullYear() + "-W" + String(weekNo).padStart(2,"0");
}

function checkWinnerCelebration() {
  // Show 90% celebration to ALL users, but only ONCE per week per member.
  // Bug fix: this used to key on the member's done-count, which worked fine
  // when that count only ever grew (all-time). Since the score is now a
  // rolling 30-day window, the count can rise AND fall as old tasks roll out
  // of the window — so the same count can recur months apart, and keying on
  // it would silently suppress a genuinely new 90% moment. Keying on the
  // calendar week instead means: still 90%+ this week -> can celebrate again
  // once, regardless of the exact number.
  if (!S.user) return;
  const team = getTeam();
  const weekKey = isoWeekKey(new Date());
  team.forEach(m => {
    const assigned = taggedTasksFor(m.name);
    if (assigned.length < 3) return;
    const done = assigned.filter(t => t.status === "completed");
    const pct  = Math.round(done.length / assigned.length * 100);
    if (pct < 90) return;
    // Key includes viewer's id so each user tracks their own "seen" state independently
    const celebKey = "karya_celeb_" + m.id + "_" + weekKey;
    const alreadySeen = localStorage.getItem(celebKey);
    if (!alreadySeen && !_winnerShownFor[celebKey]) {
      _winnerShownFor[celebKey] = true;
      localStorage.setItem(celebKey, "1");
      setTimeout(() => showWinnerCelebration(m, pct, done.length, assigned.length), 800);
    }
  });
}

function showWinnerCelebration(member, pct, done, total) {
  playWinnerChime();
  const el = document.createElement("div");
  el.className = "winner-overlay";
  el.innerHTML = [
    "<div class='winner-box'>",
    "  <div class='winner-fireworks'>🎆 🎇 ✨ 🎆 🎇</div>",
    "  <div class='winner-stars'>⭐</div>",
    "  <div class='winner-trophy'>🏆</div>",
    "  <div class='winner-name'>" + esc(member.name) + "</div>",
    "  <div class='winner-pct'>" + pct + "% Complete (" + done + "/" + total + " tasks)</div>",
    "  <div class='winner-msg1'>Congratulations!</div>",
    "  <div class='winner-msg2'>Outstanding work completing " + pct + "% of your tasks!<br>You did great — keep it up! 🌟</div>",
    "  <div class='winner-fireworks' style='margin-top:8px'>🥇 🎉 🌟 🎉 🥇</div>",
    "  <button class='winner-close' onclick='this.closest(\".winner-overlay\").remove()'>",
    "    Thank you! \uD83D\uDE4C",
    "  </button>",
    "</div>"
  ].join("");
  document.body.appendChild(el);
  // Auto close after 15 seconds
  setTimeout(() => { if (el.parentElement) el.remove(); }, 15000);
}

// ── CONFETTI ─────────────────────────────────────────────────────
function showConfetti() {
  const c=document.getElementById("confetti-canvas"); if(!c) return;
  c.style.display="block"; c.width=window.innerWidth; c.height=window.innerHeight;
  const ctx=c.getContext("2d");
  const pieces=Array.from({length:140},()=>({
    x:Math.random()*c.width,y:-10,
    vx:(Math.random()-.5)*7,vy:Math.random()*5+2,
    s:Math.random()*9+4,rot:Math.random()*360,rv:(Math.random()-.5)*9,
    col:["#FF6B6B","#FFD700","#4F7EFF","#00C896","#E8720C","#C47AC0","#fff"][Math.floor(Math.random()*7)]
  }));
  let f=0;
  (function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    pieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.rot+=p.rv;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.col;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);ctx.restore();});
    if(++f<200) requestAnimationFrame(draw); else c.style.display="none";
  })();
  const tr=document.createElement("div"); tr.className="trophy-pop";
  tr.innerHTML="🏆<br><span>Well done!</span>";
  document.body.appendChild(tr);
  setTimeout(()=>tr.remove(),4800);
}

// ── MODAL ─────────────────────────────────────────────────────────
function openModal(html, extraClass) {
  const ov = document.getElementById("modal-overlay");
  // Reset classes, then apply extra class if provided (e.g. plan-sheet-modal)
  ov.className = "modal-overlay";
  if (extraClass) ov.classList.add(extraClass);
  ov.classList.remove("hidden");
  document.getElementById("modal-box").innerHTML=html;
}
window.closeModal=function(){ const ov=document.getElementById("modal-overlay"); ov.className="modal-overlay hidden"; };
window.closeModalClick=function(e){ if(e.target===document.getElementById("modal-overlay")) closeModal(); };

// ── TOAST ─────────────────────────────────────────────────────────
function showToast(msg) {
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.classList.add("show"),10);
  setTimeout(()=>{ t.classList.remove("show"); setTimeout(()=>t.remove(),300); },2600);
}

// Toast with a clickable Undo action, up for ~5 seconds. Unlike showToast,
// this one needs pointer-events enabled so the button is actually tappable.
function showUndoToast(msg, onUndo, duration) {
  duration = duration || 5000;
  const t=document.createElement("div");
  t.className="toast";
  t.style.pointerEvents="auto";
  t.style.display="inline-flex";
  t.style.alignItems="center";
  t.style.gap="14px";
  t.style.whiteSpace="normal";
  t.style.maxWidth="86vw";
  t.style.textAlign="left";
  const msgSpan=document.createElement("span");
  msgSpan.textContent=msg;
  const undoBtn=document.createElement("button");
  undoBtn.textContent="UNDO";
  undoBtn.style.cssText="background:none;border:none;color:#FFD166;font-weight:800;font-size:13px;cursor:pointer;padding:0;text-decoration:underline;letter-spacing:.3px;white-space:nowrap;flex-shrink:0";
  t.appendChild(msgSpan);
  t.appendChild(undoBtn);
  document.body.appendChild(t);
  setTimeout(()=>t.classList.add("show"),10);

  let settled=false;
  const dismiss=()=>{ t.classList.remove("show"); setTimeout(()=>t.remove(),300); };
  const timer=setTimeout(()=>{ if(!settled){ settled=true; dismiss(); } }, duration);

  undoBtn.onclick=()=>{
    if (settled) return;
    settled=true;
    clearTimeout(timer);
    dismiss();
    onUndo();
  };
}
